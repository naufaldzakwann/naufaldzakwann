name: Generate Snake

# Membuat animasi ular dari kontribusi GitHub, dijalankan otomatis
# setiap hari (00:00 UTC) atau manual lewat tab "Actions" → "Run workflow".

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23C1121F&color_dots=%23e8e4d8,%23c98f94,%23a61b1f,%237a1015,%23E5383B
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23E5383B&color_dots=%23161B22,%233a0f14,%236b1418,%23a61b1f,%23E5383B
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push snake ke branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
