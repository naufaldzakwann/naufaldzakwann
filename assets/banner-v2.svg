<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360" role="img" aria-label="Naufal Dzakwan — Fullstack Developer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f0c29">
        <animate attributeName="stop-color" values="#0f0c29;#1b0b3b;#0f0c29" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.62" stop-color="#24243e"/>
      <stop offset="1" stop-color="#302b63"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe259"/>
      <stop offset="0.45" stop-color="#ff2e97"/>
      <stop offset="1" stop-color="#8a2be2">
        <animate attributeName="stop-color" values="#8a2be2;#00c6ff;#8a2be2" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#ff2e97"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="360" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="62" r="1.6" opacity="0.7">
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="265" cy="112" r="1.1" opacity="0.5"/>
    <circle cx="420" cy="52" r="2" opacity="0.8">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="4.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="94" r="1" opacity="0.45"/>
    <circle cx="705" cy="42" r="1.4" opacity="0.6">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="905" cy="72" r="1.1" opacity="0.5"/>
    <circle cx="1052" cy="46" r="1.9" opacity="0.75">
      <animate attributeName="opacity" values="1;0.25;1" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1198" cy="102" r="1.4" opacity="0.6"/>
    <circle cx="1352" cy="60" r="1.1" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.95;0.3" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1478" cy="118" r="1.5" opacity="0.65"/>
    <circle cx="205" cy="182" r="1" opacity="0.4"/>
    <circle cx="1428" cy="176" r="1" opacity="0.4"/>
  </g>

  <!-- Sun (classic synthwave with scanline slits) -->
  <circle cx="800" cy="272" r="100" fill="url(#sun)"/>
  <rect x="688" y="192" width="224" height="3" fill="url(#sky)"/>
  <rect x="688" y="210" width="224" height="4" fill="url(#sky)"/>
  <rect x="688" y="230" width="224" height="5" fill="url(#sky)"/>
  <rect x="688" y="252" width="224" height="7" fill="url(#sky)"/>

  <!-- Sea -->
  <rect x="0" y="272" width="1600" height="88" fill="#0b0326"/>

  <!-- Perspective grid -->
  <g stroke="url(#grid)" fill="none">
    <line x1="0" y1="272" x2="1600" y2="272" stroke-width="1.5" opacity="0.55"/>
    <line x1="0" y1="281" x2="1600" y2="281" stroke-width="1" opacity="0.28"/>
    <line x1="0" y1="292" x2="1600" y2="292" stroke-width="1" opacity="0.30"/>
    <line x1="0" y1="306" x2="1600" y2="306" stroke-width="1" opacity="0.33"/>
    <line x1="0" y1="324" x2="1600" y2="324" stroke-width="1" opacity="0.36"/>
    <line x1="0" y1="346" x2="1600" y2="346" stroke-width="1" opacity="0.40"/>
    <g stroke-width="1" opacity="0.22">
      <line x1="800" y1="272" x2="760" y2="360"/>
      <line x1="800" y1="272" x2="840" y2="360"/>
      <line x1="800" y1="272" x2="700" y2="360"/>
      <line x1="800" y1="272" x2="900" y2="360"/>
      <line x1="800" y1="272" x2="620" y2="360"/>
      <line x1="800" y1="272" x2="980" y2="360"/>
      <line x1="800" y1="272" x2="520" y2="360"/>
      <line x1="800" y1="272" x2="1080" y2="360"/>
      <line x1="800" y1="272" x2="400" y2="360"/>
      <line x1="800" y1="272" x2="1200" y2="360"/>
      <line x1="800" y1="272" x2="260" y2="360"/>
      <line x1="800" y1="272" x2="1340" y2="360"/>
      <line x1="800" y1="272" x2="100" y2="360"/>
      <line x1="800" y1="272" x2="1500" y2="360"/>
    </g>
  </g>

  <!-- Depth waves -->
  <path d="M0,318 C266,298 533,338 800,318 C1066,298 1333,338 1600,318 L1600,360 L0,360 Z" fill="#1b1140" opacity="0.85"/>
  <path d="M0,338 C320,322 640,354 960,338 C1220,326 1420,346 1600,336 L1600,360 L0,360 Z" fill="#12082b" opacity="0.9"/>

  <!-- Title -->
  <text x="800" y="118" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="80" font-weight="800" letter-spacing="5" fill="#ffffff" filter="url(#glow)">Naufal Dzakwan</text>
  <text x="800" y="168" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="600" letter-spacing="12" fill="#00e5ff" opacity="0.95">FULLSTACK DEVELOPER</text>
</svg>
