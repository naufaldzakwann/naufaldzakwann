<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360" role="img" aria-label="Naufal Dzakwan — Fullstack Developer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f0c29">
        <animate attributeName="stop-color" values="#0f0c29;#1a0b3b;#0f0c29" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.62" stop-color="#24243e"/>
      <stop offset="1" stop-color="#302b63"/>
    </linearGradient>
    <radialGradient id="neonbg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2e97" stop-opacity="0.28"/>
      <stop offset="0.65" stop-color="#8a2be2" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#8a2be2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9d2ea"/>
    </linearGradient>
    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <g id="bat">
      <path d="M-2,-1 L0,-7 L2,-1 Z"/>
      <path d="M0,0 C-5,-6 -14,-8 -22,-4 C-16,-2 -13,3 -12,9 C-8,5 -3,4 0,7 C3,4 8,5 12,9 C13,3 16,-2 22,-4 C14,-8 5,-6 0,0 Z"/>
    </g>
    <g id="spark4">
      <path d="M0,-8 C1,-3 3,-1 8,0 C3,1 1,3 0,8 C-1,3 -3,1 -8,0 C-3,-1 -1,-3 0,-8 Z"/>
    </g>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="360" fill="url(#sky)"/>

  <!-- Doodle dust: plus signs & dots -->
  <g stroke="#8a7fc0" stroke-width="1.4" opacity="0.35" stroke-linecap="round">
    <path d="M150,180 v10 M145,185 h10"/>
    <path d="M480,60 v8 M476,64 h8"/>
    <path d="M1130,190 v10 M1125,195 h10"/>
    <path d="M1460,150 v8 M1456,154 h8"/>
    <path d="M1250,320 v8 M1246,324 h8"/>
    <path d="M360,320 v8 M356,324 h8"/>
  </g>

  <!-- Bats -->
  <g fill="#2a1a4a" stroke="#ff2e97" stroke-width="1" stroke-opacity="0.45">
    <g transform="translate(295 120) scale(1.15)">
      <g>
        <use href="#bat"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 7;0 0" dur="3.4s" repeatCount="indefinite"/>
      </g>
    </g>
    <g transform="translate(1305 100) scale(-1.15 1.15)">
      <g>
        <use href="#bat"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 6;0 0" dur="4.1s" repeatCount="indefinite"/>
      </g>
    </g>
    <g transform="translate(1090 150) scale(0.75)">
      <g>
        <use href="#bat"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="2.9s" repeatCount="indefinite"/>
      </g>
    </g>
    <g transform="translate(505 168) scale(0.6)">
      <g>
        <use href="#bat"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 5;0 0" dur="3.8s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <!-- Sparkles -->
  <g filter="url(#neon)">
    <use href="#spark4" transform="translate(210 90) scale(0.9)" fill="#00e5ff">
      <animate attributeName="opacity" values="0.9;0.25;0.9" dur="3.6s" repeatCount="indefinite"/>
    </use>
    <use href="#spark4" transform="translate(1420 120) scale(1.1)" fill="#ff2e97">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4.2s" repeatCount="indefinite"/>
    </use>
    <use href="#spark4" transform="translate(565 100) scale(0.7)" fill="#ff2e97">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.8s" repeatCount="indefinite"/>
    </use>
    <use href="#spark4" transform="translate(1045 95) scale(0.8)" fill="#00e5ff">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="3.1s" repeatCount="indefinite"/>
    </use>
    <use href="#spark4" transform="translate(1330 265) scale(0.6)" fill="#ff8ac2">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="4.6s" repeatCount="indefinite"/>
    </use>
    <use href="#spark4" transform="translate(265 265) scale(0.65)" fill="#bff4ff">
      <animate attributeName="opacity" values="0.25;0.95;0.25" dur="3.9s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- Glow behind cigarette -->
  <ellipse cx="800" cy="252" rx="330" ry="140" fill="url(#neonbg)"/>

  <!-- Smoke -->
  <g fill="none" stroke-linecap="round">
    <path d="M691,266 C679,252 703,240 691,224 C681,210 703,200 695,188" stroke="#cdb9ff" stroke-width="3.5" opacity="0">
      <animate attributeName="opacity" values="0;0.55;0" dur="4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 8;0 -12" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M710,262 C720,248 702,236 712,222 C720,210 706,200 714,188" stroke="#b79fff" stroke-width="3" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0" dur="4.6s" begin="1.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 8;0 -12" dur="4.6s" begin="1.8s" repeatCount="indefinite"/>
    </path>
    <!-- tiny heart-shaped smoke puff -->
    <path d="M712,176 C706,171 704,166 707,163 C709,161 712,162 712,165 C712,162 715,161 717,163 C720,166 718,171 712,176 Z" stroke="#ff8ac2" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0.75;0" dur="4.6s" begin="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Cigarette -->
  <g transform="translate(800 258) rotate(-14)">
    <circle cx="-120" cy="0" r="13" fill="#ff2e97" opacity="0.3" filter="url(#neon)"/>
    <rect x="-116" y="-4.5" width="16" height="9" rx="4" fill="#6b6b7a"/>
    <rect x="-100" y="-7" width="168" height="14" rx="6" fill="url(#paper)" stroke="#f4ecff" stroke-width="1"/>
    <rect x="68" y="-7" width="38" height="14" rx="6" fill="#ff2e97"/>
    <circle cx="-120" cy="0" r="7.5" fill="#ff8a3c" filter="url(#neon)">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title -->
  <text x="800" y="104" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="78" font-weight="800" letter-spacing="5" fill="#ffffff" filter="url(#glow)">Naufal Dzakwan</text>
  <text x="800" y="146" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="600" letter-spacing="12" fill="#00e5ff" opacity="0.95">FULLSTACK DEVELOPER</text>
</svg>
