  <title id="greeting-title">nice to meet you</title>
  <desc id="greeting-description">The greeting types one letter at a time from the left, holds the full line, then fades and types again in an endless loop.</desc>
  <!-- Original outlined lettering, with one staggered entrance per character. -->
  <style>
    /* One loop per letter over a shared 5s cycle: type in, hold, fade out, retype. */
    .letter { opacity: 0; }
