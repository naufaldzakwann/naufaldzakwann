  <title id="name-title">NAUFAL DZAKWAN</title>
  <desc id="name-description">Naufal Dzakwan in clear, bold pale rose lettering on black with a slow, gentle blinking glow.</desc>
  <!-- Letterforms outlined from Avenir Next Condensed Bold; no font requests or scripts. -->
  <style>
    .name-light { animation: name-blink 5.6s ease-in-out infinite; }
    @keyframes name-blink {
      0%, 17%, 44%, 70%, 100% { opacity: 1; }
      25%, 32% { opacity: .70; }
      78%, 85% { opacity: .82; }
    }
    @media (prefers-reduced-motion: reduce) {
      .name-light { animation: none; opacity: 1; }
    }
  </style>
