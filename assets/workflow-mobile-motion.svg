<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260" role="img" aria-labelledby="title desc">
  <title id="title">Design, build, test, ship</title>
  <desc id="desc">Interface design, application development, quality assurance, and delivery.</desc>

  <style>
    .flow-trace { stroke-dasharray: 5 8; animation: flow-dash 3s linear infinite; }
    .stage { animation: stage-active 8s linear infinite; }
    .stage-2 { animation-delay: -6s; }
    .stage-3 { animation-delay: -4s; }
    .stage-4 { animation-delay: -2s; }
    @keyframes flow-dash { to { stroke-dashoffset: -52; } }
    @keyframes stage-active {
      0%, 20% { stroke: #e9bacd; fill: #21131e; }
      25%, 100% { stroke: #49313e; fill: #08070a; }
    }
    @media (prefers-reduced-motion: reduce) {
      .flow-trace, .stage { animation: none; }
      .flow-signal { display: none; }
    }
  </style>
  <rect x=".5" y=".5" width="479" height="259" rx="3" fill="#08070a" stroke="#352531"/>
  <g fill="#af8e9f" font-family="ui-monospace,Consolas,monospace" font-size="10" letter-spacing="1.4"><text x="24" y="29">HOW I WORK</text><text x="456" y="29" text-anchor="end">IDEA → RELEASE</text></g>
  <path d="M24 46h432M240 64v170M24 150h432" stroke="#352531" fill="none"/>

  <g aria-hidden="true">
    <rect class="stage stage-1" x="14" y="58" width="210" height="38" rx="3" fill="#08070a" stroke="#49313e" stroke-width="1"/>
    <rect class="stage stage-2" x="254" y="58" width="210" height="38" rx="3" fill="#08070a" stroke="#49313e" stroke-width="1"/>
    <rect class="stage stage-3" x="14" y="170" width="210" height="38" rx="3" fill="#08070a" stroke="#49313e" stroke-width="1"/>
    <rect class="stage stage-4" x="254" y="170" width="210" height="38" rx="3" fill="#08070a" stroke="#49313e" stroke-width="1"/>
    <path class="flow-trace" d="M224 77H254M359 96V156H119V170M224 189H254" stroke="#b77f9b" stroke-width="1.5" fill="none"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <g transform="translate(24 0)"><text y="79" fill="#a77991" font-size="10">01</text><text x="25" y="82" fill="#e9bacd" font-size="23" font-weight="600">Design</text><text y="111" fill="#bda4b2" font-size="12">Clear interfaces</text><text y="129" fill="#bda4b2" font-size="12">&amp; user flows</text></g>
    <g transform="translate(264 0)"><text y="79" fill="#a77991" font-size="10">02</text><text x="25" y="82" fill="#e9bacd" font-size="23" font-weight="600">Build</text><text y="111" fill="#bda4b2" font-size="12">Frontend, backend</text><text y="129" fill="#bda4b2" font-size="12">&amp; data</text></g>
    <g transform="translate(24 112)"><text y="79" fill="#a77991" font-size="10">03</text><text x="25" y="82" fill="#e9bacd" font-size="23" font-weight="600">Test</text><text y="111" fill="#bda4b2" font-size="12">Useful checks &amp; automation</text></g>
    <g transform="translate(264 112)"><text y="79" fill="#a77991" font-size="10">04</text><text x="25" y="82" fill="#e9bacd" font-size="23" font-weight="600">Ship</text><text y="111" fill="#bda4b2" font-size="12">Release &amp; keep improving</text></g>
  </g>
</svg>
