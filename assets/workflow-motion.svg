<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 156" width="960" height="156" role="img" aria-labelledby="title desc">
  <title id="title">Design, build, test, ship</title>
  <desc id="desc">From interface design and application development to quality assurance and delivery.</desc>

  <style>
    .flow-trace { stroke-dasharray: 5 8; animation: flow-dash 3s linear infinite; }
    .stage { animation: stage-active 8s linear infinite; }
    .stage-2 { animation-delay: -6s; }
    .stage-3 { animation-delay: -4s; }
    .stage-4 { animation-delay: -2s; }
    @keyframes flow-dash { to { stroke-dashoffset: -52; } }
    @keyframes stage-active {
      0%, 20% { stroke: #e9bacd; fill: #21131e; }
      25%, 100% { stroke: #49313e; fill: #08070a; }
    }
    @media (prefers-reduced-motion: reduce) {
      .flow-trace, .stage { animation: none; }
      .flow-signal { display: none; }
    }
  </style>
  <defs><linearGradient id="line"><stop stop-color="#e9bacd"/><stop offset="1" stop-color="#8a536b"/></linearGradient></defs>
  <rect x=".5" y=".5" width="959" height="155" rx="3" fill="#08070a" stroke="#352531"/>
  <path d="M24 25h8m-4-4v8M928 25h8m-4-4v8" stroke="#856579"/>
  <g fill="#af8e9f" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="2">
    <text x="44" y="29">HOW I WORK</text><text x="916" y="29" text-anchor="end">IDEA → RELEASE</text>
  </g>
  <path d="M44 49h872" stroke="#352531"/>

  <g aria-hidden="true">
    <rect class="stage stage-1" x="32" y="62" width="192" height="34" rx="3" fill="#08070a" stroke="#49313e" stroke-width="1"/>
    <rect class="stage stage-2" x="266" y="62" width="192" height="34" rx="3" fill="#08070a" stroke="#49313e" stroke-width="1"/>
    <rect class="stage stage-3" x="500" y="62" width="192" height="34" rx="3" fill="#08070a" stroke="#49313e" stroke-width="1"/>
    <rect class="stage stage-4" x="734" y="62" width="192" height="34" rx="3" fill="#08070a" stroke="#49313e" stroke-width="1"/>
    <path class="flow-trace" d="M224 79H266M458 79H500M692 79H734" stroke="#b77f9b" stroke-width="1.5" fill="none"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <g transform="translate(44 0)"><text y="82" fill="#a77991" font-size="11" font-family="ui-monospace,Consolas,monospace">01</text><text x="30" y="84" fill="#e9bacd" font-size="24" font-weight="600">Design</text><text y="121" fill="#bda4b2" font-size="13">Clear interfaces &amp; user flows</text></g>
    <g transform="translate(278 0)"><text y="82" fill="#a77991" font-size="11" font-family="ui-monospace,Consolas,monospace">02</text><text x="30" y="84" fill="#e9bacd" font-size="24" font-weight="600">Build</text><text y="121" fill="#bda4b2" font-size="13">Frontend, backend &amp; data</text></g>
    <g transform="translate(512 0)"><text y="82" fill="#a77991" font-size="11" font-family="ui-monospace,Consolas,monospace">03</text><text x="30" y="84" fill="#e9bacd" font-size="24" font-weight="600">Test</text><text y="121" fill="#bda4b2" font-size="13">Useful checks &amp; automation</text></g>
    <g transform="translate(746 0)"><text y="82" fill="#a77991" font-size="11" font-family="ui-monospace,Consolas,monospace">04</text><text x="30" y="84" fill="#e9bacd" font-size="24" font-weight="600">Ship</text><text y="121" fill="#bda4b2" font-size="13">Release &amp; keep improving</text></g>
  </g>
  <g fill="none" stroke="url(#line)" stroke-width="1.3"><path d="M224 78h26m-5-5 5 5-5 5M458 78h26m-5-5 5 5-5 5M692 78h26m-5-5 5 5-5 5"/></g>
  <path d="M74 142H772" fill="none" stroke="#49313e" aria-hidden="true"/>
  <circle class="flow-signal" r="2.5" fill="#fce1ec" aria-hidden="true">
    <animateMotion path="M74 142H772" dur="8s" repeatCount="indefinite" />
  </circle>
</svg>
